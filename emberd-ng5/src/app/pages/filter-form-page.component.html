<header class="page-head">
  <h1>Filters / {{ id ? 'Edit' : 'New' }}</h1>
  <button (click)="back()">Back to list</button>
</header>
<p class="error" *ngIf="error">{{ error }}</p>
<div class="element-host">
  <osos-filter-form *ngIf="ready"
    [attr.mode]="mode"
    [attr.filter-id]="id"
    (saved)="back()"
    (cancelled)="back()"
    (failed)="onFailed($event.detail)">
  </osos-filter-form>
</div>
